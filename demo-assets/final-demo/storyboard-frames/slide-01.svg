<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="38" y="36" width="1204" height="648" rx="34" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <rect x="72" y="70" width="52" height="52" rx="16" fill="#0f172a"/>
  <text x="142" y="104" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a">WorkTape</text>
  <text x="1084" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#64748b">Final demo draft</text>
  <text x="92" y="184" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3" fill="#2563eb">THE PROBLEM</text>
  <text x="92" y="228" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#0f172a">Small businesses do work before</text>
<text x="92" y="278" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#0f172a">they can describe software.</text>
  <text x="92" y="342" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#334155">Leads, appointments, payments, and tickets still move</text>
<text x="92" y="381" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#334155">through chats and sheets.</text>
<text x="92" y="420" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#334155">The painful part is not building forms. It is turning</text>
<text x="92" y="459" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#334155">messy repeated work into a clear spec.</text>

  <rect x="72" y="594" width="1136" height="70" rx="22" fill="#0f172a"/>
  <text x="92" y="620" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">WorkTape starts from observed work, not a blank prompt.</text>
  <text x="1134" y="638" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#94a3b8">01</text>
</svg>